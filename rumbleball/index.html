<!DOCTYPE html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#101729" />
    <meta name="description" content="Votre club, vos tactiques, votre arène. Recrutez une équipe de Rumbleball et menez-la au sommet de la ligue cyberpunk de The Hub." />
    <title>Rumbleball Manager — The Hub</title>
    <link rel="icon" href="icon.svg" type="image/svg+xml" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="rumbleball.css" />
    <link rel="stylesheet" href="app.css" />
    <link rel="stylesheet" href="career.css" />
    <link rel="stylesheet" href="broadcast.css" />
    <link rel="stylesheet" href="studio.css?v=20261019-desktop" />
    <script type="module" src="app.mjs"></script>
  </head>
  <body class="rb-app">
    <a class="rb-skip" href="#jeu">Aller au jeu</a>
    <header class="rb-app-header">
      <div class="rb-app-brand">
        <img src="icon.svg" alt="" width="44" height="44" />
        <h1>Rumbleball <span>Manager</span></h1>
      </div>
      <div class="rb-shell-context" data-shell-context hidden></div>
      <div class="rb-shell-navigation" data-shell-nav hidden></div>
      <div class="rb-shell-tools" data-shell-tools hidden></div>
      <a class="rb-hub-link" href="../#outils-rumbleball"><span aria-hidden="true">↗</span> Retour à The Hub</a>
    </header>
    <main id="jeu" class="rb-app-main" tabindex="-1">
      <div data-rumbleball>
        <p class="rb-loading" role="status">Ouverture du vestiaire…</p>
        <noscript>Activez JavaScript pour gérer votre club et disputer des matchs.</noscript>
      </div>
    </main>
  </body>
</html>
